<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0c">
    <title>Tipos de habitación · Hotel TerraNova</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/terranova.css">
</head>
<body>
<div id="topbarHost"></div>
<div class="app-shell">
    <div id="sidebarHost"></div>
    <main class="content">
        <div class="page-header">
            <div>
                <div class="crumbs">Administración / Tipos</div>
                <h1 class="page-title">Tipos de habitación</h1>
                <p class="page-sub">Categorías, capacidad y tarifas base por noche.</p>
            </div>
            <a href="/tipos/form" class="btn btn-tn"><i class="bi bi-plus-circle me-1"></i>Nuevo tipo</a>
        </div>
        <div id="flashHost"></div>
        <div class="card-tn">
            <div class="table-wrap"><table class="table table-tn align-middle">
                <thead><tr><th>Tipo</th><th>Capacidad</th><th class="text-end">Precio base</th><th class="text-end">Habitaciones</th><th class="text-end">Acciones</th></tr></thead>
                <tbody id="tbodyTipos"><tr><td colspan="5" class="text-center py-4 text-muted">Cargando…</td></tr></tbody>
            </table></div>
        </div>
    </main>
</div>
<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/terranova.js"></script>
<script src="/js/chat-widget.js"></script>
<script src="/js/layout.js"></script>
<script>
(function () {
    function cargar() {
        TN.get('/api/tipos').then(function (lista) {
            var tb = document.getElementById('tbodyTipos');
            if (!lista || !lista.length) {
                tb.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No hay tipos registrados.</td></tr>';
                return;
            }
            tb.innerHTML = lista.map(function (t) {
                return '<tr><td><div class="cell-main">' + TN.esc(t.nombre) + '</div><div class="cell-sub">' + TN.esc(t.descripcion) + '</div></td>'
                    + '<td>' + t.capacidad + ' pers.</td>'
                    + '<td class="text-end"><span class="money">' + TN.money(t.precioBase) + '</span></td>'
                    + '<td class="text-end">' + (t.totalHabitaciones || 0) + '</td>'
                    + '<td class="text-end text-nowrap">'
                    + '<a href="/tipos/detalle?id=' + t.idTipo + '" class="btn-icon view me-1" title="Ver"><i class="bi bi-eye"></i></a>'
                    + '<a href="/tipos/form?id=' + t.idTipo + '" class="btn-icon edit me-1" title="Editar"><i class="bi bi-pencil"></i></a>'
                    + '<button type="button" class="btn-icon del" title="Eliminar" data-del="' + t.idTipo + '" data-nom="' + TN.esc(t.nombre) + '"><i class="bi bi-trash3"></i></button>'
                    + '</td></tr>';
            }).join('');
            tb.querySelectorAll('[data-del]').forEach(function (b) {
                b.addEventListener('click', function () {
                    var id = b.getAttribute('data-del'), nom = b.getAttribute('data-nom');
                    TNLayout.confirmarEliminar({
                        entidad: 'el tipo', nombre: nom,
                        nota: 'Solo se puede eliminar si ninguna habitación lo utiliza.',
                        onConfirm: function () {
                            return TN.del('/api/tipos/' + id).then(function (r) {
                                TNLayout.showFlash('exito', r.mensaje); cargar();
                            }).catch(function (e) { TNLayout.showFlash('aviso', e.message); });
                        }
                    });
                });
            });
        }).catch(function (e) { TNLayout.showFlash('error', e.message); });
    }
    TNLayout.init({ activo: 'tipos', roles: ['ADMINISTRADOR'] }).then(cargar);
})();
</script>
</body>
</html>
