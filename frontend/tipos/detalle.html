<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0c">
    <title>Detalle del tipo · Hotel TerraNova</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/terranova.css">
</head>
<body>
<div id="topbarHost"></div>
<div class="app-shell">
    <div id="sidebarHost"></div>
    <main class="content">
        <div class="page-header">
            <div>
                <div class="crumbs"><a href="/tipos/lista">Tipos</a> / Detalle</div>
                <h1 class="page-title" id="titTipo">Tipo de habitación</h1>
            </div>
            <div class="d-flex gap-2">
                <a href="/tipos/lista" class="btn btn-soft"><i class="bi bi-arrow-left me-1"></i>Volver</a>
                <a id="btnEditar" href="#" class="btn btn-tn"><i class="bi bi-pencil me-1"></i>Editar</a>
            </div>
        </div>
        <div id="flashHost"></div>
        <div id="detHost"><div class="text-center py-5 text-muted">Cargando…</div></div>
    </main>
</div>
<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/terranova.js"></script>
<script src="/js/chat-widget.js"></script>
<script src="/js/layout.js"></script>
<script>
(function () {
    var id = TN.qs('id');
    TNLayout.init({ activo: 'tipos', roles: ['ADMINISTRADOR'] }).then(function () {
        if (!id) { location.href = '/tipos/lista'; return; }
        document.getElementById('btnEditar').href = '/tipos/form?id=' + encodeURIComponent(id);
        return TN.get('/api/tipos/' + encodeURIComponent(id));
    }).then(function (d) {
        if (!d) { return; }
        var t = d.tipo, habs = d.habitaciones || [];
        document.getElementById('titTipo').textContent = t.nombre;
        var tabla = !habs.length
            ? '<div class="empty-state py-4">No hay habitaciones asignadas a este tipo.</div>'
            : '<div class="table-wrap"><table class="table table-tn align-middle"><thead><tr><th>Hotel</th><th>Número</th><th>Piso</th><th>Estado</th></tr></thead><tbody>'
              + habs.map(function (x) {
                  return '<tr><td>' + TN.esc(x.hotelNombre) + '</td><td><a href="/habitaciones/detalle?id=' + x.idHabitacion + '" class="cell-main text-decoration-none text-dark">' + TN.esc(x.numero) + '</a></td><td>Piso ' + x.piso + '</td><td>' + TN.estadoBadge(x.estado) + '</td></tr>';
              }).join('') + '</tbody></table></div>';
        document.getElementById('detHost').innerHTML = '<div class="card-tn mb-4"><div class="card-body-tn"><div class="detail-grid">'
            + '<div class="detail-item"><div class="lbl">Capacidad</div><div class="val">' + t.capacidad + ' personas</div></div>'
            + '<div class="detail-item"><div class="lbl">Precio base</div><div class="val money">' + TN.money(t.precioBase) + ' / noche</div></div>'
            + '<div class="detail-item"><div class="lbl">Descripción</div><div class="val">' + TN.esc(t.descripcion) + '</div></div>'
            + '</div></div></div>'
            + '<div class="card-tn"><div class="card-head"><h5>Habitaciones (' + habs.length + ')</h5></div>' + tabla + '</div>';
    }).catch(function (e) { TNLayout.showFlash('error', e.message); });
})();
</script>
</body>
</html>
