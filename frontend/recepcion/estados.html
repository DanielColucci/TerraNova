<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0c">
    <title>Estados de habitación · Hotel TerraNova</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/terranova.css">
</head>
<body>
<div id="topbarHost"></div>
<div class="app-shell">
    <div id="sidebarHost"></div>

    <main class="content">
        <div class="page-header">
            <div>
                <div class="crumbs"><a href="/recepcion/panel">Recepción</a> / Estados</div>
                <h1 class="page-title">Estados de habitación</h1>
                <p class="page-sub">Marca habitaciones en mantenimiento/limpieza o libéralas nuevamente como disponibles.</p>
            </div>
        </div>

        <div id="flashHost"></div>

        <div class="card-tn">
            <div class="card-head">
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="chip active" data-estado-filtro="todos">Todas</button>
                    <button type="button" class="chip" data-estado-filtro="disponible">Disponibles</button>
                    <button type="button" class="chip" data-estado-filtro="ocupada">Ocupadas</button>
                    <button type="button" class="chip" data-estado-filtro="mantenimiento">Mantenimiento</button>
                </div>
                <input type="search" class="form-control form-control-sm" style="max-width:260px" placeholder="Filtrar hotel o número…" data-filtro-tabla="#tablaEstados">
            </div>
            <div class="table-wrap"><table class="table table-tn align-middle" id="tablaEstados">
                <thead><tr><th>Hotel</th><th>Habitación</th><th>Piso</th><th>Tipo</th><th>Estado</th><th class="text-end">Acción</th></tr></thead>
                <tbody id="tbodyEstados"><tr><td colspan="6" class="text-center py-4 text-muted">Cargando…</td></tr></tbody>
            </table></div>
        </div>
    </main>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/terranova.js"></script>
<script src="/js/chat-widget.js"></script>
<script src="/js/layout.js"></script>
<script>
(function () {
    function cargar() {
        TN.get('/api/recepcion/estados').then(function (lista) {
            var tb = document.getElementById('tbodyEstados');
            if (!lista || !lista.length) {
                tb.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Sin habitaciones registradas.</td></tr>';
                return;
            }
            tb.innerHTML = lista.map(function (h) {
                var acc = h.estado === 'Disponible'
                    ? '<button type="button" class="btn btn-soft btn-sm" data-mant="' + h.idHabitacion + '"><i class="bi bi-tools me-1"></i>A mantenimiento</button>'
                    : h.estado === 'Mantenimiento'
                    ? '<button type="button" class="btn btn-emerald btn-sm" data-disp="' + h.idHabitacion + '"><i class="bi bi-check-circle me-1"></i>Marcar disponible</button>'
                    : '<span class="small text-muted">Ocupada (cerrar en Check-out)</span>';
                return '<tr data-fila data-estado="' + TN.esc(h.estadoCss) + '">'
                    + '<td class="cell-main">' + TN.esc(h.hotelNombre) + '</td>'
                    + '<td class="cell-main">' + TN.esc(h.numero) + '</td>'
                    + '<td>Piso ' + h.piso + '</td>'
                    + '<td>' + TN.esc(h.tipoNombre) + '</td>'
                    + '<td>' + TN.estadoBadge(h.estado) + '</td>'
                    + '<td class="text-end">' + acc + '</td></tr>';
            }).join('');

            tb.querySelectorAll('[data-mant]').forEach(function (b) {
                b.addEventListener('click', function () {
                    TN.post('/api/recepcion/estados/' + b.getAttribute('data-mant') + '/mantenimiento', {}).then(function (r) {
                        TNLayout.showFlash('exito', r.mensaje); cargar();
                    }).catch(function (e) { TNLayout.showFlash('aviso', e.message); });
                });
            });
            tb.querySelectorAll('[data-disp]').forEach(function (b) {
                b.addEventListener('click', function () {
                    TN.post('/api/recepcion/estados/' + b.getAttribute('data-disp') + '/disponible', {}).then(function (r) {
                        TNLayout.showFlash('exito', r.mensaje); cargar();
                    }).catch(function (e) { TNLayout.showFlash('aviso', e.message); });
                });
            });
        }).catch(function (err) { TNLayout.showFlash('error', err.message); });
    }

    TNLayout.init({ activo: 'h-estados', roles: ['RECEPCIONISTA', 'ADMINISTRADOR'] }).then(cargar);
})();
</script>
</body>
</html>
