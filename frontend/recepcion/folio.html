<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0c">
    <title>Folio de estancia · Hotel TerraNova</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/terranova.css">
</head>
<body>
<div id="topbarHost"></div>
<div class="app-shell">
    <div id="sidebarHost"></div>

    <main class="content">
        <div class="page-header no-print">
            <div>
                <div class="crumbs"><a href="/recepcion/checkout">Check-out</a> / Folio</div>
                <h1 class="page-title">Folio de estancia</h1>
            </div>
            <div class="d-flex gap-2">
                <a href="/recepcion/checkout" class="btn btn-soft"><i class="bi bi-arrow-left me-1"></i>Volver</a>
                <button type="button" class="btn btn-tn" onclick="window.print()"><i class="bi bi-printer me-1"></i>Imprimir folio</button>
            </div>
        </div>

        <div id="flashHost"></div>
        <div id="folioHost"><div class="text-center py-5 text-muted">Cargando folio…</div></div>
    </main>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/terranova.js"></script>
<script src="/js/chat-widget.js"></script>
<script src="/js/layout.js"></script>
<script>
(function () {
    var id = TN.qs('id');
    TNLayout.init({ activo: 'h-checkout', roles: ['RECEPCIONISTA', 'ADMINISTRADOR'] }).then(function () {
        if (!id) { location.href = '/recepcion/checkout'; return; }
        return TN.get('/api/recepcion/estancias/' + encodeURIComponent(id));
    }).then(function (d) {
        if (!d) { return; }
        var e = d.estancia, h = e.habitacion || {};
        document.getElementById('folioHost').innerHTML = '<div class="card-tn mx-auto" style="max-width:720px">'
            + '<div class="card-head"><div><div class="informe-marca">Hotel TerraNova · Sanctuary &amp; Resort</div><h5 class="mt-1">Folio #' + e.idEstancia + '</h5></div>'
            + (e.activa ? '<span class="estado-badge estado-encurso"><span class="dot"></span>En curso</span>' : '<span class="estado-badge estado-finalizada"><span class="dot"></span>Cerrado</span>') + '</div>'
            + '<div class="card-body-tn">'
            + '<div class="folio-row"><span>Huésped</span><strong>' + TN.esc(e.huesped) + '</strong></div>'
            + '<div class="folio-row"><span>Identificación</span><strong>' + TN.esc(e.identificacion) + '</strong></div>'
            + '<div class="folio-row"><span>Hotel</span><strong>' + TN.esc(h.hotelNombre) + ' (' + TN.esc(h.hotelCiudad) + ')</strong></div>'
            + '<div class="folio-row"><span>Habitación</span><strong>Hab. ' + TN.esc(h.numero) + ' · ' + TN.esc(h.tipoNombre) + '</strong></div>'
            + '<div class="folio-row"><span>Entrada</span><strong>' + TN.fechaHora(e.fechaEntrada) + '</strong></div>'
            + '<div class="folio-row"><span>Salida ' + (e.activa ? 'prevista' : 'real') + '</span><strong>' + (e.activa ? TN.fecha(e.fechaSalidaPrevista) : TN.fechaHora(e.fechaSalidaReal)) + '</strong></div>'
            + '<div class="folio-row"><span>Hospedaje (' + d.noches + ' noches × ' + TN.money(e.precioNoche) + ')</span><strong class="money">' + TN.money(d.importe) + '</strong></div>'
            + (e.cargosExtra != null ? '<div class="folio-row"><span>Cargos adicionales</span><strong class="money">' + TN.money(e.cargosExtra) + '</strong></div>' : '')
            + (e.metodoPago ? '<div class="folio-row"><span>Forma de pago</span><strong>' + TN.esc(e.metodoPago) + '</strong></div>' : '')
            + '<div class="folio-grand mt-3"><span>Total</span><strong>' + TN.money(e.total != null ? e.total : d.importe) + '</strong></div>'
            + '</div></div>';
    }).catch(function (err) { TNLayout.showFlash('error', err.message); });
})();
</script>
</body>
</html>
