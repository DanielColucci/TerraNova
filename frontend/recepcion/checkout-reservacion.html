<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0c">
    <title>Check-out de reservación · Hotel TerraNova</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/terranova.css">
</head>
<body>
<div id="topbarHost"></div>
<div class="app-shell">
    <div id="sidebarHost"></div>

    <main class="content">
        <div class="page-header">
            <div>
                <div class="crumbs"><a href="/recepcion/checkout">Check-out</a> / Reservación</div>
                <h1 class="page-title">Confirmar check-out</h1>
            </div>
            <a href="/recepcion/checkout" class="btn btn-soft"><i class="bi bi-arrow-left me-1"></i>Volver</a>
        </div>

        <div id="flashHost"></div>
        <div id="coHost"><div class="text-center py-5 text-muted">Cargando…</div></div>
    </main>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/terranova.js"></script>
<script src="/js/chat-widget.js"></script>
<script src="/js/layout.js"></script>
<script>
(function () {
    var id = TN.qs('id');
    TNLayout.init({ activo: 'h-checkout', roles: ['RECEPCIONISTA', 'ADMINISTRADOR'] }).then(function () {
        if (!id) { location.href = '/recepcion/checkout'; return; }
        return TN.get('/api/recepcion/checkout/reservacion/' + encodeURIComponent(id));
    }).then(function (d) {
        if (!d) { return; }
        var r = d.reservacion, h = r.habitacion || {}, importe = Number(r.costoTotal || 0);
        document.getElementById('coHost').innerHTML = '<div class="row g-4">'
            + '<div class="col-lg-6"><div class="card-tn"><div class="card-head"><h5>Reservación #' + r.idReservacion + '</h5>' + (d.pagadoEnLinea ? '<span class="estado-badge estado-disponible">Pagada en línea</span>' : '') + '</div>'
            + '<div class="card-body-tn">'
            + '<div class="folio-row"><span>Huésped</span><strong>' + TN.esc(r.nombreHuesped) + '</strong></div>'
            + '<div class="folio-row"><span>Habitación</span><strong>' + TN.esc(h.hotelNombre) + ' · Hab. ' + TN.esc(h.numero) + '</strong></div>'
            + '<div class="folio-row"><span>Estancia</span><strong>' + TN.fecha(r.fechaEntrada) + ' → ' + TN.fecha(r.fechaSalida) + ' (' + r.noches + ' noches)</strong></div>'
            + '<div class="folio-row"><span>Hospedaje</span><strong class="money">' + TN.money(importe) + '</strong></div>'
            + '<div class="folio-grand mt-3"><span>Total a liquidar</span><strong id="totalCobrar">' + TN.money(importe) + '</strong></div>'
            + '</div></div></div>'
            + '<div class="col-lg-6"><form id="formCo" class="card-tn"><div class="card-body-tn">'
            + '<div class="mb-3"><label class="form-label" for="cargosExtra">Cargos adicionales (consumos, minibar, etc.)</label><input type="number" step="0.01" min="0" value="0" id="cargosExtra" class="form-control" required></div>'
            + '<div class="mb-3"><label class="form-label" for="metodoPago">Forma de pago</label><select id="metodoPago" class="form-select">' + (d.metodos || []).map(function (m) { return '<option value="' + m + '">' + m + '</option>'; }).join('') + '</select></div>'
            + '<div class="mb-3"><label class="form-label" for="estadoHab">Estado de la habitación al salir</label><select id="estadoHab" class="form-select"><option value="Mantenimiento">Mantenimiento (limpieza)</option><option value="Disponible">Disponible</option></select></div>'
            + '<button type="submit" class="btn btn-emerald btn-lg w-100"><i class="bi bi-check-circle me-1"></i>Cerrar folio y registrar check-out</button>'
            + '</div></form></div></div>';

        var extra = document.getElementById('cargosExtra'), total = document.getElementById('totalCobrar');
        extra.addEventListener('input', function () {
            var v = parseFloat(extra.value);
            if (isNaN(v) || v < 0) { v = 0; }
            total.textContent = TN.money(importe + v);
        });
        document.getElementById('formCo').addEventListener('submit', function (e) {
            e.preventDefault();
            var btn = this.querySelector('button[type=submit]'); btn.disabled = true;
            TN.post('/api/recepcion/checkout/reservacion/' + encodeURIComponent(id), {
                cargosExtra: parseFloat(extra.value) || 0,
                metodoPago: document.getElementById('metodoPago').value,
                estadoHabitacion: document.getElementById('estadoHab').value
            }).then(function (res) {
                TN.flash('exito', res.mensaje);
                location.href = '/recepcion/folio?id=' + res.idEstancia;
            }).catch(function (err) { btn.disabled = false; TNLayout.showFlash('aviso', err.message); });
        });
    }).catch(function (err) { TNLayout.showFlash('aviso', err.message); });
})();
</script>
</body>
</html>
