<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0c">
    <title>Confirmar Check-in · Hotel TerraNova</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/terranova.css">
</head>
<body>
<div id="topbarHost"></div>
<div class="app-shell">
    <div id="sidebarHost"></div>

    <main class="content">
        <div class="page-header">
            <div>
                <div class="crumbs"><a href="/recepcion/panel">Recepción</a> / <a href="/recepcion/checkin">Check-in</a> / Detalle</div>
                <h1 class="page-title">Validar llegada</h1>
            </div>
            <a href="/recepcion/checkin" class="btn btn-soft"><i class="bi bi-arrow-left me-1"></i>Volver</a>
        </div>

        <div id="flashHost"></div>
        <div id="detHost"><div class="text-center py-5 text-muted">Cargando reservación…</div></div>
    </main>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/terranova.js"></script>
<script src="/js/chat-widget.js"></script>
<script src="/js/layout.js"></script>
<script>
(function () {
    var id = TN.qs('id');

    TNLayout.init({ activo: 'h-checkin', roles: ['RECEPCIONISTA', 'ADMINISTRADOR'] }).then(function () {
        if (!id) { location.href = '/recepcion/checkin'; return; }
        return TN.get('/api/recepcion/checkin/' + encodeURIComponent(id));
    }).then(function (d) {
        if (!d) { return; }
        var r = d.reservacion, h = r.habitacion || {};
        var box = '';
        if (d.yaIngreso || r.checkinRealizado) {
            box = '<div class="alert flash flash-info"><i class="bi bi-info-circle-fill"></i><div>Esta reservación ya cuenta con ingreso / check-in registrado.</div></div>';
        } else if (r.estado === 'Cancelada') {
            box = '<div class="alert flash flash-error"><i class="bi bi-x-octagon-fill"></i><div>Esta reservación está cancelada y no puede hacer check-in.</div></div>';
        } else {
            var pagoHtml = d.pagoPendiente
                ? '<div class="mb-3"><label class="form-label" for="selMetodo">Cobro en mostrador · Forma de pago</label>'
                  + '<select id="selMetodo" class="form-select">' + (d.metodos || []).map(function (m) { return '<option value="' + m + '">' + m + '</option>'; }).join('') + '</select>'
                  + '<div class="form-hint">Se cobrará ' + TN.money(r.costoTotal) + ' en mostrador al confirmar el check-in.</div></div>'
                : '<div class="alert flash flash-exito mb-3"><i class="bi bi-check-circle-fill"></i><div>' + (d.pagadoEnLinea ? 'Pagada en línea.' : 'Reservación confirmada.') + ' Lista para entregar habitación.</div></div>';
            box = '<form id="formCheckin" class="checkin-box">' + pagoHtml
                + '<button type="submit" class="btn btn-emerald btn-lg w-100"><i class="bi bi-key me-2"></i>Confirmar check-in y entregar habitación ' + TN.esc(h.numero) + '</button></form>';
        }

        document.getElementById('detHost').innerHTML = ''
            + '<div class="row g-4"><div class="col-lg-7"><div class="card-tn"><div class="card-head"><h5>Reservación #' + r.idReservacion + '</h5>' + TN.estadoBadge(r.estado) + '</div>'
            + '<div class="card-body-tn">'
            + '<div class="folio-row"><span>Huésped</span><strong>' + TN.esc(r.nombreHuesped) + '</strong></div>'
            + '<div class="folio-row"><span>Teléfono / Correo</span><strong>' + TN.esc(r.telefono) + (r.correo ? ' · ' + TN.esc(r.correo) : '') + '</strong></div>'
            + '<div class="folio-row"><span>Hotel</span><strong>' + TN.esc(h.hotelNombre) + '</strong></div>'
            + '<div class="folio-row"><span>Habitación</span><strong>Hab. ' + TN.esc(h.numero) + ' · ' + TN.esc(h.tipoNombre) + ' (Piso ' + h.piso + ')</strong></div>'
            + '<div class="folio-row"><span>Estancia</span><strong>' + TN.fecha(r.fechaEntrada) + ' → ' + TN.fecha(r.fechaSalida) + ' (' + r.noches + ' noches)</strong></div>'
            + '<div class="folio-row"><span>Personas</span><strong>' + r.adultos + ' adultos · ' + r.ninos + ' niños</strong></div>'
            + '<div class="folio-grand mt-3"><span>Total</span><strong>' + TN.money(r.costoTotal) + '</strong></div>'
            + '</div></div></div><div class="col-lg-5">' + box + '</div></div>';

        var f = document.getElementById('formCheckin');
        if (f) {
            f.addEventListener('submit', function (e) {
                e.preventDefault();
                var sel = document.getElementById('selMetodo');
                var btn = f.querySelector('button[type=submit]');
                btn.disabled = true;
                TN.post('/api/recepcion/checkin/' + encodeURIComponent(id), { metodoPago: sel ? sel.value : null })
                    .then(function (res) {
                        TN.flash('exito', res.mensaje);
                        location.href = '/recepcion/panel';
                    }).catch(function (err) {
                        btn.disabled = false;
                        TNLayout.showFlash('aviso', err.message);
                    });
            });
        }
    }).catch(function (err) { TNLayout.showFlash('error', err.message); });
})();
</script>
</body>
</html>
