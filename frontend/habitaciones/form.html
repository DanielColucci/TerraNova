<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0c">
    <title>Habitación · Hotel TerraNova</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/terranova.css">
</head>
<body>
<div id="topbarHost"></div>
<div class="app-shell">
    <div id="sidebarHost"></div>
    <main class="content">
        <div class="page-header">
            <div>
                <div class="crumbs"><a href="/habitaciones/lista">Habitaciones</a> / <span id="crumbAcc">Nueva</span></div>
                <h1 class="page-title" id="titForm">Nueva habitación</h1>
            </div>
            <a href="/habitaciones/lista" class="btn btn-soft"><i class="bi bi-arrow-left me-1"></i>Volver</a>
        </div>
        <div id="flashHost"></div>
        <form id="formHab" class="card-tn" style="max-width:720px">
            <div class="card-body-tn">
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label" for="idHotel">Hotel</label><select id="idHotel" class="form-select" required></select></div>
                    <div class="col-md-6"><label class="form-label" for="idTipo">Tipo de habitación</label><select id="idTipo" class="form-select" required></select></div>
                    <div class="col-md-4"><label class="form-label" for="numero">Número</label><input id="numero" class="form-control" maxlength="10" required></div>
                    <div class="col-md-4"><label class="form-label" for="piso">Piso</label><input id="piso" type="number" min="0" max="100" value="1" class="form-control" required></div>
                    <div class="col-md-4"><label class="form-label" for="estado">Estado</label><select id="estado" class="form-select" required></select></div>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-tn"><i class="bi bi-check-lg me-1"></i>Guardar</button>
                    <a href="/habitaciones/lista" class="btn btn-soft">Cancelar</a>
                </div>
            </div>
        </form>
    </main>
</div>
<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/terranova.js"></script>
<script src="/js/chat-widget.js"></script>
<script src="/js/layout.js"></script>
<script>
(function () {
    var id = TN.qs('id');

    function llenarCatalogos(cat, actual) {
        var sh = document.getElementById('idHotel');
        sh.innerHTML = '<option value="">Selecciona un hotel…</option>' + (cat.hoteles || []).map(function (h) {
            return '<option value="' + h.idHotel + '"' + (actual && actual.idHotel == h.idHotel ? ' selected' : '') + '>' + TN.esc(h.nombre) + (h.activo ? '' : ' (Inactivo)') + '</option>';
        }).join('');
        var st = document.getElementById('idTipo');
        st.innerHTML = '<option value="">Selecciona un tipo…</option>' + (cat.tipos || []).map(function (t) {
            return '<option value="' + t.idTipo + '"' + (actual && actual.idTipo == t.idTipo ? ' selected' : '') + '>' + TN.esc(t.nombre) + ' (' + TN.money(t.precioBase) + ')</option>';
        }).join('');
        var se = document.getElementById('estado');
        se.innerHTML = (cat.estados || ['Disponible', 'Ocupada', 'Mantenimiento']).map(function (e) {
            return '<option value="' + e + '"' + (actual && actual.estado === e ? ' selected' : '') + '>' + e + '</option>';
        }).join('');
    }

    TNLayout.init({ activo: 'habitaciones', roles: ['ADMINISTRADOR'] }).then(function () {
        if (!id) {
            return TN.get('/api/habitaciones/catalogos').then(function (cat) { llenarCatalogos(cat, null); });
        }
        document.getElementById('crumbAcc').textContent = 'Editar';
        document.getElementById('titForm').textContent = 'Editar habitación';
        return TN.get('/api/habitaciones/' + encodeURIComponent(id)).then(function (h) {
            document.getElementById('numero').value = h.numero || '';
            document.getElementById('piso').value = h.piso;
            return TN.get('/api/habitaciones/catalogos?idHotelActual=' + h.idHotel).then(function (cat) {
                llenarCatalogos(cat, h);
            });
        });
    }).catch(function (e) { TNLayout.showFlash('error', e.message); });

    document.getElementById('formHab').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = this.querySelector('button[type=submit]'); btn.disabled = true;
        var body = {
            idHotel: Number(document.getElementById('idHotel').value) || null,
            idTipo: Number(document.getElementById('idTipo').value) || null,
            numero: document.getElementById('numero').value.trim(),
            piso: parseInt(document.getElementById('piso').value, 10),
            estado: document.getElementById('estado').value
        };
        var req = id ? TN.put('/api/habitaciones/' + encodeURIComponent(id), body) : TN.post('/api/habitaciones', body);
        req.then(function (r) {
            TN.flash('exito', r.mensaje);
            location.href = '/habitaciones/lista';
        }).catch(function (err) { btn.disabled = false; TNLayout.showFlash('aviso', err.message); });
    });
})();
</script>
</body>
</html>
