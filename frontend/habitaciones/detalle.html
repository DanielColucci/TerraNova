<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0c">
    <title>Detalle de habitación · Hotel TerraNova</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/terranova.css">
</head>
<body>
<div id="topbarHost"></div>
<div class="app-shell">
    <div id="sidebarHost"></div>
    <main class="content">
        <div class="page-header">
            <div>
                <div class="crumbs"><a href="/habitaciones/lista">Habitaciones</a> / Detalle</div>
                <h1 class="page-title" id="titHab">Habitación</h1>
            </div>
            <div class="d-flex gap-2">
                <a href="/habitaciones/lista" class="btn btn-soft"><i class="bi bi-arrow-left me-1"></i>Volver</a>
                <a id="btnEditar" href="#" class="btn btn-tn"><i class="bi bi-pencil me-1"></i>Editar</a>
            </div>
        </div>
        <div id="flashHost"></div>
        <div id="detHost"><div class="text-center py-5 text-muted">Cargando…</div></div>
    </main>
</div>
<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/terranova.js"></script>
<script src="/js/chat-widget.js"></script>
<script src="/js/layout.js"></script>
<script>
(function () {
    var id = TN.qs('id');
    TNLayout.init({ activo: 'habitaciones', roles: ['ADMINISTRADOR'] }).then(function () {
        if (!id) { location.href = '/habitaciones/lista'; return; }
        document.getElementById('btnEditar').href = '/habitaciones/form?id=' + encodeURIComponent(id);
        return TN.get('/api/habitaciones/' + encodeURIComponent(id));
    }).then(function (h) {
        if (!h) { return; }
        document.getElementById('titHab').textContent = 'Habitación ' + h.numero;
        document.getElementById('detHost').innerHTML = '<div class="card-tn"><div class="card-body-tn"><div class="detail-grid">'
            + '<div class="detail-item"><div class="lbl">Hotel</div><div class="val"><a href="/hoteles/detalle?id=' + h.idHotel + '">' + TN.esc(h.hotelNombre) + '</a></div></div>'
            + '<div class="detail-item"><div class="lbl">Número</div><div class="val">' + TN.esc(h.numero) + '</div></div>'
            + '<div class="detail-item"><div class="lbl">Piso</div><div class="val">Piso ' + h.piso + '</div></div>'
            + '<div class="detail-item"><div class="lbl">Tipo</div><div class="val">' + TN.esc(h.tipoNombre) + ' (' + h.capacidad + ' personas)</div></div>'
            + '<div class="detail-item"><div class="lbl">Tarifa base</div><div class="val money">' + TN.money(h.precioBase) + ' / noche</div></div>'
            + '<div class="detail-item"><div class="lbl">Estado</div><div class="val">' + TN.estadoBadge(h.estado) + '</div></div>'
            + '</div></div></div>';
    }).catch(function (e) { TNLayout.showFlash('error', e.message); });
})();
</script>
</body>
</html>
