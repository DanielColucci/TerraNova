# Perfil de producción: spring.profiles.active=prod
# Todos los secretos y orígenes vienen de variables de entorno (sin valores por omisión).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.thymeleaf.cache=true

app.jwt.secret=${JWT_SECRET}
app.auth.dev-mode=false
app.cookie.secure=true
app.base-url=${APP_BASE_URL}
app.frontend-url=${APP_FRONTEND_URL}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.compression.enabled=true
logging.level.root=INFO

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_FROM}
