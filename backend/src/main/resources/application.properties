spring.application.name=gestion-hoteles

# Base de datos MySQL (valores reales por variables de entorno / .env)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/terranova_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Thymeleaf (solo para plantillas de correo HTML en templates/email/)
spring.thymeleaf.cache=false
spring.mvc.ignore-default-model-on-redirect=true

server.port=${PORT:8080}

# Spring AI (Ollama local + Gemini)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:llama3.2}
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2}
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.num-ctx=8192

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
spring.ai.google.genai.chat.temperature=0.2

spring.http.client.read-timeout=180s

logging.level.ia.tools=INFO

# Memoria del chat (Spring AI + JDBC)
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Autenticación JWT (HS256, mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:}
app.jwt.horas=${JWT_HORAS:8}
app.auth.dev-mode=${AUTH_DEV_MODE:false}
app.cookie.secure=${APP_COOKIE_SECURE:false}

# CORS y URL pública del frontend (Vercel / local)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5500}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

# Correo (Gmail SMTP por variables de entorno)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from=${MAIL_FROM:no-reply@terranova.local}
app.mail.nombre=${MAIL_NOMBRE:TerraNova}

# Pago simulado: minutos que se retiene la habitación
app.pago.minutos-retencion=${PAGO_MINUTOS_RETENCION:15}

# Compresión de respuestas
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/csv
server.compression.min-response-size=1024
